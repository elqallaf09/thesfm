services:
  sfm-ai:
    image: ${SFM_VLLM_IMAGE:-vllm/vllm-openai:latest}
    restart: unless-stopped
    ipc: host
    command:
      - --model
      - ${SFM_MODEL:?SFM_MODEL is required}
      - --served-model-name
      - ${SFM_SERVED_MODEL:?SFM_SERVED_MODEL is required}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${SFM_AI_API_KEY:?SFM_AI_API_KEY is required}
      - --max-model-len
      - ${SFM_MAX_MODEL_LEN:-32768}
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      - 127.0.0.1:${SFM_BIND_PORT:-8000}:8000
    volumes:
      - sfm_hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${SFM_GPU_COUNT:-1}
              capabilities: [gpu]

volumes:
  sfm_hf_cache:
