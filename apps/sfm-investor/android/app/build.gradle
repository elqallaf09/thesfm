plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseValue = { String name, String fallback = '' ->
  def value = providers.gradleProperty(name).orElse(fallback).get()
  return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
  namespace 'com.thesfm.investor'
  compileSdk 36

  defaultConfig {
    applicationId 'com.thesfm.investor'
    minSdk 26
    targetSdk 36
    versionCode 1
    versionName '0.1.0'
    buildConfigField 'String', 'SFM_API_BASE_URL', releaseValue('SFM_API_BASE_URL', 'https://www.the-sfm.com')
  }

  flavorDimensions 'distribution'
  productFlavors {
    play { dimension 'distribution' }
    huawei { dimension 'distribution' }
  }

  buildFeatures { compose true; buildConfig true }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
}

dependencies {
  def composeBom = platform('androidx.compose:compose-bom:2025.08.00')
  implementation composeBom
  implementation 'androidx.activity:activity-compose:1.11.0'
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.material:material-icons-extended'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  debugImplementation 'androidx.compose.ui:ui-tooling'
}
