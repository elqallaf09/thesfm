name: Reviewed listings freshness (advisory)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 3'
permissions:
  contents: read
concurrency:
  group: reviewed-listings-freshness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Test read-only date audit
        run: node --test scripts/market-listings/audit-freshness.test.mjs
      - name: Report freshness without renewing records
        run: node scripts/market-listings/audit-freshness.mjs
