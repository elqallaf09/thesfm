name: Macro geometry evidence summary
on:
  push:
    branches: [diagnostics/macro-sensitivity-verification]
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Summarize existing geometry only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const url = 'https://api.github.com/repos/elqallaf09/thesfm/actions/jobs/108679944531/logs';
          const response = await fetch(url, { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }, signal: AbortSignal.timeout(40000) });
          if (!response.ok) throw new Error('logs HTTP ' + response.status);
          const evidence = [];
          for (const raw of (await response.text()).split('\n')) {
            const line = raw.replace(/\u001b\[[0-9;]*m/g, '');
            const match = line.match(/EXACT (ar|en|fr) (\d+) ([\w-]+) (\{.*\})/);
            if (!match) continue;
            const [_, locale, width, variant, json] = match;
            const g = JSON.parse(json);
            const row = { locale, width, variant, overflow: g.pageOverflow, scrollX:g.scrollX };
            if (variant === 'base' && (g.pageOverflow > 4 || g.scrollX !== 0)) {
              row.fields = g.fields;
              row.wide = g.wide;
              row.active = g.active;
            }
            evidence.push(row);
          }
          console.log('GEOMETRY_SUMMARY\n' + JSON.stringify(evidence, null, 2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, '```json\n' + JSON.stringify(evidence, null, 2) + '\n```');
          NODE
