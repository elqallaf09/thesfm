name: Macro sensitivity exact geometry
on:
  push:
    branches: [diagnostics/macro-sensitivity-verification]
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 94203ff71047d2922e9fac774fba8ac3ae598176
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build exact source
        run: |
          pnpm build
          install -d -m 700 "$RUNNER_TEMP/playwright-tls"
          openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes -keyout "$RUNNER_TEMP/playwright-tls/key.pem" -out "$RUNNER_TEMP/playwright-tls/cert.pem" -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1'
          chmod 600 "$RUNNER_TEMP/playwright-tls/"*.pem
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.the-sfm.com
      - name: Instrument original journey without changing application
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file='tests/smoke/macro-simulator-sensitivity.spec.ts';
          let spec=readFileSync(file,'utf8');
          const start=spec.indexOf('    const widths =');
          const end=spec.indexOf('    await testInfo.attach(',start);
          if(start<0 || end<0) throw new Error('probe anchor');
          spec=spec.slice(0,start)+`
              for (const width of [1440,820,390,360]) {
                await page.setViewportSize({width,height:1000});
                for (const [name,css] of [
                  ['base',' '],
                  ['grid','[data-testid="macro-sensitivity"], [data-testid="macro-sensitivity"] figure{grid-template-columns:minmax(0,1fr)}'],
                  ['children','[data-testid="macro-sensitivity"] > *, [data-testid="macro-sensitivity"] svg{min-inline-size:0;max-inline-size:100%}'],
                  ['notes','[data-testid="macro-lab"] textarea{min-inline-size:0;max-inline-size:100%}'],
                  ['hidden-panel','[data-testid="macro-sensitivity"]{display:none}']
                ]) {
                  const style=await page.addStyleTag({content:css});
                  const geometry=await page.evaluate(() => {
                    const lab=document.querySelector('[data-testid="macro-lab"]')!;
                    const describe=(e:Element) => {const r=e.getBoundingClientRect();const s=getComputedStyle(e);return {tag:e.tagName,cls:e.getAttribute('class'),x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),sw:e.scrollWidth,cw:e.clientWidth,min:s.minWidth,max:s.maxWidth,grid:s.gridTemplateColumns,overflow:s.overflowX};};
                    const clipped=(e:Element) => {for(let p=e.parentElement;p && p!==lab;p=p.parentElement){if(['auto','scroll','hidden','clip'].includes(getComputedStyle(p).overflowX))return true;}return false;};
                    return {viewport:innerWidth,pageOverflow:document.documentElement.scrollWidth-innerWidth,scrollX,active:document.activeElement && lab.contains(document.activeElement)?describe(document.activeElement):null,fields:[...lab.querySelectorAll('textarea,form,[data-testid="macro-sensitivity"]')].map(describe),wide:[...lab.querySelectorAll('*')].filter(e=>{const r=e.getBoundingClientRect();return r.width && (r.right>innerWidth+4 || r.x < -4) && !clipped(e)}).slice(0,14).map(describe)};
                  });
                  console.log('EXACT '+locale+' '+width+' '+name+' '+JSON.stringify(geometry));
                  await style.evaluate(e=>e.remove());
                }
              }
              await testInfo.attach('exact-synthetic-panel-'+locale,{body:await panel.screenshot(),contentType:'image/png'});
          `+spec.slice(end);
          writeFileSync('tests/smoke/macro-geometry.local.spec.ts',spec);
          NODE
      - name: Original synthetic interactions with scoped geometry
        run: pnpm exec playwright test tests/smoke/macro-geometry.local.spec.ts --no-deps --project=chromium-desktop --retries=0 --reporter=list
        env:
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
          PLAYWRIGHT_HTTPS_LOOPBACK: '1'
          PLAYWRIGHT_WEB_SERVER_COMMAND: node scripts/playwright-https-proxy.mjs
          PLAYWRIGHT_TLS_CERT_PATH: ${{ runner.temp }}/playwright-tls/cert.pem
          PLAYWRIGHT_TLS_KEY_PATH: ${{ runner.temp }}/playwright-tls/key.pem
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.the-sfm.com
      - name: Remove DOM contexts
        if: always()
        run: find test-results -type f -name error-context.md -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: macro-exact-geometry-94203ff
          path: test-results/
          if-no-files-found: warn
          retention-days: 1
