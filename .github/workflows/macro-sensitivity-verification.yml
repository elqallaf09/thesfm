name: Macro sensitivity verification
on:
  push:
    branches: [diagnostics/macro-sensitivity-verification]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c802021728cae73523fc389830f9c9bd309e3e40
          persist-credentials: false
      - name: Package tracked text source only
        run: |
          python3 - <<'PY'
          import pathlib, subprocess, zipfile
          roots = ('src/', 'tests/', 'scripts/', 'docs/', '.github/workflows/')
          extensions = {'.ts', '.tsx', '.css', '.json', '.mjs', '.cjs', '.yml', '.yaml', '.md'}
          with zipfile.ZipFile('macro-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0'):
                  path = pathlib.Path(name)
                  if name and (name.startswith(roots) or '/' not in name) and path.suffix in extensions and path.is_file() and path.stat().st_size < 2_000_000:
                      archive.write(path, name)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: macro-source-c802021
          path: macro-source.zip
          retention-days: 1
