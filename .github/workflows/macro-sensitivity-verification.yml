name: Macro final failure summary
on:
  push:
    branches: [diagnostics/macro-sensitivity-verification]
permissions:
  contents: read
  actions: read
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read original focused and required browser results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json'};
          for (const id of [108675690669,108675647448]) {
            const res=await fetch(`https://api.github.com/repos/elqallaf09/thesfm/actions/jobs/${id}/logs`,{headers,signal:AbortSignal.timeout(45000)});
            if(!res.ok)throw new Error('HTTP '+res.status);
            const lines=(await res.text()).split('\n').map(line=>line.replace(/\u001b\[[0-9;]*m/g,'').replace(/^\d{4}-\d{2}-\d{2}T\S+\s*/,''));
            console.log('JOB '+id);
            for(let i=0;i<lines.length;i++)if(/^\s*\d+\) \[/.test(lines[i]))console.log(lines.slice(i,i+30).join('\n'));
            console.log('TOTALS\n'+lines.filter(line=>/^\s*\d+ (passed|failed|flaky|skipped)|Error:|Expected:|Received:/.test(line)).slice(-35).join('\n'));
          }
          NODE
