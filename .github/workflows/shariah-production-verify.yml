name: Shariah production refresh verification
on:
  push:
    branches: [main, fix/shariah-evidence-coverage-production-proof]
    paths:
      - 'src/lib/sharia-research/**'
      - 'src/lib/market/shariah*'
      - 'src/app/api/market/shariah/**'
      - 'src/app/sfm-admin-control/shariah/**'
      - 'src/app/api/sharia-stocks/screening/**'
      - 'scripts/shariah/verify-production-session.mjs'
      - '.github/workflows/shariah-production-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shariah-production-refresh
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'elqallaf09/thesfm' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/fix/shariah-evidence-coverage-production-proof')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify normal admin session, real refresh and persisted read-back
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
        run: node scripts/shariah/verify-production-session.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shariah-production-proof
          path: proof/production-session.json
          retention-days: 7
