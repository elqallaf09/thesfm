name: Markets TV packages
on:
  push:
    branches: [main]
    paths: ['apps/markets-tv/**', 'public/markets-tv/**', 'src/components/markets-tv/**', 'src/lib/markets-tv/**', 'src/app/tv/**', 'scripts/build-markets-tv.mjs', 'tests/helpers/**', '.github/scripts/install-playwright-browsers.sh', '.github/workflows/markets-tv.yml']
  pull_request:
    branches: [main]
    paths: ['apps/markets-tv/**', 'src/components/markets-tv/**', 'src/lib/markets-tv/**', 'src/app/tv/**', 'scripts/build-markets-tv.mjs', 'tests/packaged/**', 'tests/helpers/**', 'playwright.tv.config.ts', 'pnpm-lock.yaml', '.github/scripts/install-playwright-browsers.sh', '.github/workflows/markets-tv.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: markets-tv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:

  browser:
    name: CI/Markets TV packaged browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tv
      - name: Install Chromium with network retries
        timeout-minutes: 10
        run: bash .github/scripts/install-playwright-browsers.sh chromium
      - name: Verify packaged TV layout, accounts and remote navigation
        run: pnpm exec playwright test --config=playwright.tv.config.ts --reporter=line
      - name: Keep TV browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markets-tv-browser-${{ github.sha }}
          if-no-files-found: ignore
          path: test-results/

  android-debug:
    name: CI/Markets TV debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: pnpm install --frozen-lockfile
      - name: Bundle current SFM TV source into Android
        run: pnpm build:tv
      - name: Verify account handoff policy and assemble installable debug APKs
        working-directory: apps/markets-tv/android
        run: gradle --no-daemon :app:testPreviewDebugUnitTest assembleDebug
      - name: Verify APK outputs and record build information
        run: |
          test -s apps/markets-tv/android/app/build/outputs/apk/huawei/debug/app-huawei-debug.apk
          test -s apps/markets-tv/android/app/build/outputs/apk/preview/debug/app-preview-debug.apk
          python3 - <<'PY'
          import json, pathlib, re
          source = pathlib.Path('apps/markets-tv/android/app/build.gradle').read_text()
          version = re.search(r"versionName '([0-9.]+)'", source).group(1)
          build = int(re.search(r'versionCode ([0-9]+)', source).group(1))
          pathlib.Path('.tv-build').mkdir(exist_ok=True)
          pathlib.Path('.tv-build/release.json').write_text(json.dumps({'version': version, 'build': build}))
          PY
          sha256sum apps/markets-tv/android/app/build/outputs/apk/*/debug/*.apk > .tv-build/debug-apk.sha256
      - name: Publish debug APKs for device testing
        uses: actions/upload-artifact@v7
        with:
          name: markets-tv-debug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          path: |
            .tv-build/release.json
            .tv-build/debug-apk.sha256
            apps/markets-tv/android/app/build/outputs/apk/*/debug/*.apk

  android-release:
    name: CI/Markets TV release compile and lint
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tv
      - name: Compile unsigned release APKs, bundles and lint separately
        working-directory: apps/markets-tv/android
        run: gradle --no-daemon assembleRelease bundleRelease lint
      - name: Upload compiled release evidence (not store-signed)
        uses: actions/upload-artifact@v7
        with:
          name: markets-tv-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .tv-build/tizen
            .tv-build/webos
            apps/markets-tv/android/app/build/outputs/apk/*/release
            apps/markets-tv/android/app/build/outputs/bundle
            apps/markets-tv/android/app/build/reports/lint-results-*.html

  packages:
    name: CI/Markets TV packages and Android
    if: always()
    needs: [browser, android-debug, android-release]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve required CI gate after splitting browser and Android jobs
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          DEBUG_RESULT: ${{ needs.android-debug.result }}
          RELEASE_RESULT: ${{ needs.android-release.result }}
        run: |
          test "$BROWSER_RESULT" = success
          test "$DEBUG_RESULT" = success
          test "$RELEASE_RESULT" = success
          echo "Packaged browser, installable debug APK, release compilation and lint all passed."

  preview-release:
    name: Publish tested TV preview APK
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: markets-tv-debug-${{ github.sha }}
          path: tv-artifacts
      - name: Publish installable TV test packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mapfile -t TV_APKS < <(find tv-artifacts -name 'app-huawei-debug.apk' -type f)
          mapfile -t TV_PREVIEW_APKS < <(find tv-artifacts -name 'app-preview-debug.apk' -type f)
          test "${#TV_APKS[@]}" -eq 1
          test "${#TV_PREVIEW_APKS[@]}" -eq 1
          TV_METADATA="$(find tv-artifacts -name release.json -type f -print -quit)"
          test -n "$TV_METADATA"
          TV_BUILD="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["build"]))' "$TV_METADATA")"
          TV_VERSION="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$TV_METADATA")"
          TV_APK_NAME="SFM-TV-Huawei-build$TV_BUILD.apk"
          TV_PREVIEW_APK_NAME="SFM-TV-Preview-build$TV_BUILD.apk"
          cp "${TV_APKS[0]}" "$TV_APK_NAME"
          cp "${TV_PREVIEW_APKS[0]}" "$TV_PREVIEW_APK_NAME"
          sha256sum "$TV_APK_NAME" > "$TV_APK_NAME.sha256"
          sha256sum "$TV_PREVIEW_APK_NAME" > "$TV_PREVIEW_APK_NAME.sha256"
          printf 'Version: %s (build %s)\nSource commit: %s\n\n' "$TV_VERSION" "$TV_BUILD" "$RELEASE_SHA" > release-notes.md
          cat >> release-notes.md <<'NOTES'
          SFM TV preview for Huawei tablets and Android TV. Version and build are embedded in the APK.
          Includes My Account with profile editing through the browser or a phone QR code, direct market brief and map navigation with the selected destination retained after reload, removal of My Channels, and restored news images. Display settings show the installed Android app version and build number.
          
          These are CI-signed debug test APKs, not AppGallery or Google Play releases. The Huawei package uses com.thesfm.marketstv. CI debug certificates are not guaranteed to match an existing installation, so this is not a promised update for an installed production app.

          The SFM TV Preview APK uses com.thesfm.marketstv.preview and installs separately from the production package. It has its own settings and sign-in state. Open Display settings to verify the app version and build number.
          NOTES
          gh release create "sfm-tv-build$TV_BUILD-$RELEASE_SHA" "$TV_APK_NAME" "$TV_APK_NAME.sha256" "$TV_PREVIEW_APK_NAME" "$TV_PREVIEW_APK_NAME.sha256" --target "$RELEASE_SHA" --title "SFM TV $TV_VERSION (build $TV_BUILD) preview" --prerelease --notes-file release-notes.md
