name: Markets TV packages
on:
  push:
    branches: [main]
    paths: ['apps/markets-tv/**', 'public/markets-tv/**', 'src/components/markets-tv/**', 'src/lib/markets-tv/**', 'src/app/tv/**', 'scripts/build-markets-tv.mjs', '.github/workflows/markets-tv.yml']
  pull_request:
    branches: [main]
    paths: ['apps/markets-tv/**', 'src/components/markets-tv/**', 'src/lib/markets-tv/**', 'src/app/tv/**', 'scripts/build-markets-tv.mjs', 'tests/packaged/**', 'playwright.tv.config.ts', 'pnpm-lock.yaml', '.github/workflows/markets-tv.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: markets-tv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  packages:
    name: CI/Markets TV packages and Android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:tv
      - run: pnpm exec playwright install --with-deps chromium
      - name: Verify packaged TV layout and remote navigation
        run: pnpm exec playwright test --config=playwright.tv.config.ts
      - name: Retain TV browser verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markets-tv-browser-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            test-results
            playwright-report
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Compile and lint Android TV application
        working-directory: apps/markets-tv/android
        run: gradle --no-daemon assembleDebug assembleRelease bundleRelease lint
      - name: Record preview version
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          source = pathlib.Path('apps/markets-tv/android/app/build.gradle').read_text()
          version = re.search(r"versionName '([0-9.]+)'", source).group(1)
          build = int(re.search(r'versionCode ([0-9]+)', source).group(1))
          pathlib.Path('.tv-build/release.json').write_text(json.dumps({'version': version, 'build': build}))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: markets-tv-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .tv-build/release.json
            .tv-build/tizen
            .tv-build/webos
            apps/markets-tv/android/app/build/outputs/apk
            apps/markets-tv/android/app/build/outputs/bundle
            apps/markets-tv/android/app/build/reports/lint-results-*.html

  preview-release:
    name: Publish tested TV preview APKs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: markets-tv-${{ github.sha }}
          path: tv-artifacts
      - name: Publish installable TV test packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          mapfile -t TV_APKS < <(find tv-artifacts -name 'app-huawei-debug.apk' -type f)
          test "${#TV_APKS[@]}" -eq 1
          mapfile -t TV_PREVIEW_APKS < <(find tv-artifacts -name 'app-preview-debug.apk' -type f)
          test "${#TV_PREVIEW_APKS[@]}" -eq 1
          TV_METADATA="$(find tv-artifacts -name release.json -type f -print -quit)"
          test -n "$TV_METADATA"
          TV_BUILD="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["build"]))' "$TV_METADATA")"
          TV_APK_NAME="SFM-TV-Huawei-build$TV_BUILD.apk"
          cp "${TV_APKS[0]}" "$TV_APK_NAME"
          sha256sum "$TV_APK_NAME" > "$TV_APK_NAME.sha256"
          TV_PREVIEW_APK_NAME="SFM-TV-Preview-build$TV_BUILD.apk"
          cp "${TV_PREVIEW_APKS[0]}" "$TV_PREVIEW_APK_NAME"
          sha256sum "$TV_PREVIEW_APK_NAME" > "$TV_PREVIEW_APK_NAME.sha256"
          cat > release-notes.md <<'NOTES'
          SFM TV preview for Huawei tablets and Android TV. Version and build are embedded in the APK.
          Includes one-screen market customization, a fixed Save and view action, clearer remote navigation, named upper controls and simultaneous news boards.
          
          Both APKs are signed debug test packages, not AppGallery or Google Play releases. Unsigned Release outputs are not attached.

          - SFM-TV-Preview: SFM TV Preview, application ID com.thesfm.marketstv.preview. This separate app installs alongside com.thesfm.marketstv and com.thesfm.marketstv.huaweitest. Keep the existing app and its settings; settings are not automatically migrated to Preview.
          - SFM-TV-Huawei: application ID com.thesfm.marketstv. An in-place update requires its signing certificate to match the installed app. A fresh CI debug certificate does not establish that continuity. It remains separate from com.thesfm.marketstv.huaweitest, whose settings are not migrated.

          Do not uninstall the existing app or clear its data to install this preview. The Android interface is bundled in the APK; a website deployment does not update the installed interface.
          NOTES
          gh release create "sfm-tv-build$TV_BUILD-$RELEASE_SHA" "$TV_APK_NAME" "$TV_APK_NAME.sha256" "$TV_PREVIEW_APK_NAME" "$TV_PREVIEW_APK_NAME.sha256" --target "$RELEASE_SHA" --title "SFM TV build $TV_BUILD preview" --prerelease --notes-file release-notes.md
