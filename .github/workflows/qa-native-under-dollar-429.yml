name: Under-dollar iPhone app simulator evidence
on:
  push:
    branches: [qa/native-under-dollar-429]
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-26
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: local-test-placeholder
      NEXT_TELEMETRY_DISABLED: 1
      EXPO_NO_TELEMETRY: 1
      CI: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.1.3 }
      - uses: actions/setup-node@v7
        with: { node-version: 22.13.0 }
      - name: Boot iPhone simulator and prepare local fixture origin
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for runtime,devs in reversed(list(json.load(sys.stdin)["devices"].items())) if ".iOS-" in runtime for d in devs if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          python3 - <<'PY'
          from pathlib import Path
          import json
          config=Path('apps/markets-tv-mobile/app.json')
          obj=json.loads(config.read_text())
          obj['expo']['ios']['infoPlist']['NSAppTransportSecurity']={'NSAllowsLocalNetworking':True}
          config.write_text(json.dumps(obj))
          p=Path('apps/markets-tv-mobile/src/navigation.ts')
          s=p.read_text().replace("export const HOME_URL = 'https://www.the-sfm.com/tv'","export const HOME_URL = 'http://localhost:3583/tv'")
          p.write_text(s.replace('const url = new URL(value);', "const url = new URL(value);\n    if (url.origin === 'http://localhost:3583') return 'internal';"))
          PY
      - name: Prepare the SFM TV mobile app
        working-directory: apps/markets-tv-mobile
        run: |
          pnpm install --frozen-lockfile
          pnpm exec expo prebuild --platform ios --no-install
          cd ios
          pod install
      - name: Compile the real iOS app for the simulator
        working-directory: apps/markets-tv-mobile
        run: |
          workspace=$(find ios -maxdepth 1 -name '*.xcworkspace' | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          set -o pipefail
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -destination "id=$SIMULATOR_UDID" -derivedDataPath "$RUNNER_TEMP/phone-build" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/iphone-build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/iphone-build.log"; exit 1; }
      - name: Measure both strips inside SFM TV's WKWebView
        run: |
          pnpm install --frozen-lockfile
          NEXT_BUILD_SKIP_CHECKS=1 pnpm build > "$RUNNER_TEMP/phone-build-next.log" 2>&1 || { tail -60 "$RUNNER_TEMP/phone-build-next.log"; exit 1; }
          pnpm exec next start -H 127.0.0.1 -p 3590 > "$RUNNER_TEMP/phone-next.log" 2>&1 &
          node .github/qa-phone/proxy.cjs > "$RUNNER_TEMP/phone-proxy.log" 2>&1 &
          for i in {1..60}; do curl -sf http://localhost:3583/tv -o /dev/null && break; sleep 2; done
          app=$(find "$RUNNER_TEMP/phone-build/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' | head -1)
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" "$app"
          xcrun simctl launch "$SIMULATOR_UDID" com.thesfm.marketstv.mobile
          for i in {1..90}; do test -s /tmp/sfm-native-result.json && break; sleep 2; done
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/iphone-screen.png"
          cat /tmp/sfm-native-result.json
          python3 -c 'import json; assert json.load(open("/tmp/sfm-native-result.json"))["ok"]'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: in-app-headline-proof
          path: |
            ${{ runner.temp }}/phone-next.log
            ${{ runner.temp }}/phone-proxy.log
            /tmp/sfm-native-result.json
            ${{ runner.temp }}/iphone-screen.png
          if-no-files-found: ignore
          retention-days: 3
