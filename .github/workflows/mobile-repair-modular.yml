name: Verify modular mobile drawer
on:
  push:
    branches: [fix/mobile-symbol-data-20260916]
    paths: [.github/workflows/mobile-repair-modular.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply modular data controller and design-token corrections
        run: |
          python .repair/modularize.py
          node --check src/trader-app/public/app.js
          node --check src/trader-app/public/assets/drawer-data.js
          node scripts/check-source-complexity.mjs
          git diff --check
          git rm -r .repair
          git rm .github/workflows/mobile-repair-modular.yml
          git add src
          git -c user.name='SFM repair' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor(trader): isolate symbol data controller and respect typography tokens'
          git push origin HEAD:fix/mobile-symbol-data-20260916
      - run: npm install -g pnpm@11.1.3
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: Full unit regression suite
        if: success() || failure()
        run: |
          mkdir -p .artifacts
          pnpm test:run > .artifacts/unit.log 2>&1 || { tail -150 .artifacts/unit.log; exit 1; }
          tail -12 .artifacts/unit.log
      - name: Install browsers
        if: success() || failure()
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: All drawer browser journeys
        if: success() || failure()
        env:
          E2E_BASE_URL: http://127.0.0.1:9
        run: |
          mkdir -p .artifacts
          pnpm exec playwright test tests/smoke/trader-symbol-data.spec.ts tests/smoke/trader-drawer-focus.spec.ts tests/smoke/trader-drawer-host-focus.spec.ts --no-deps --project=chromium-desktop --project=mobile-chrome --project=mobile-webkit --retries=0 > .artifacts/browser.log 2>&1 || { tail -100 .artifacts/browser.log; exit 1; }
          tail -10 .artifacts/browser.log
      - name: Archive exact source
        if: always()
        run: |
          mkdir -p .artifacts/source
          git rev-parse HEAD > .artifacts/source/head.txt
          git archive --format=tar.gz HEAD > .artifacts/source/sfm-tested.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modular-mobile-drawer-verification
          path: |
            .artifacts/
            playwright-report/
            test-results/
          include-hidden-files: true
          retention-days: 3
