name: Apply signal card completeness fix

on:
  push:
    branches:
      - fix/signal-card-evidence-20260916
    paths:
      - .github/workflows/apply-signal-card-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/signal-card-evidence-20260916
      - name: Apply tested signal-card repair
        shell: bash
        run: |
          set -euo pipefail
          git show e3392f51facb767941c7909a210e822e90696973:.github/workflows/apply-signal-card-fix.yml > /tmp/original.yml
          python <<'PYTHON'
          from pathlib import Path
          from textwrap import dedent
          text = Path('/tmp/original.yml').read_text()
          script = dedent(text.split('        run: |\n', 1)[1])
          start = script.index("replace('src/app/api/recommendations/route.ts'")
          end = script.index("replace('src/lib/market/fetchYahooQuote.ts'", start)
          script = script[:start] + script[end:]
          Path('/tmp/apply.sh').write_text(script)
          PYTHON
          bash /tmp/apply.sh
