name: Apply signal card completeness fix

on:
  push:
    branches:
      - fix/signal-card-evidence-20260916
    paths:
      - .github/workflows/apply-signal-card-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/signal-card-evidence-20260916
      - name: Apply tested signal-card repair
        shell: bash
        run: |
          set -euo pipefail
          git show e3392f51facb767941c7909a210e822e90696973:.github/workflows/apply-signal-card-fix.yml > /tmp/original.yml
          python <<'PYTHON'
          from pathlib import Path
          from textwrap import dedent
          text = Path('/tmp/original.yml').read_text()
          script = dedent(text.split('        run: |\n', 1)[1])
          old = '"  const sourceMeta = requestedSymbols.length\\n    ? requestedSymbols\\n    : universe.symbolMeta;",\n    "  const sourceMeta = uniqueRecommendationSymbols(requestedSymbols.length\\n    ? requestedSymbols\\n    : universe.symbolMeta);")'
          new = '"  const sourceMeta = requestedSymbols.length\\n    ? universe.symbolMeta.filter(symbol => requestedKeySet.has(normalizeSymbol(symbol.symbol)) || requestedKeySet.has(normalizeSymbol(symbol.providerSymbol)))\\n    : universe.symbolMeta;",\n    "  const sourceMeta = uniqueRecommendationSymbols(requestedSymbols.length\\n    ? universe.symbolMeta.filter(symbol => requestedKeySet.has(normalizeSymbol(symbol.symbol)) || requestedKeySet.has(normalizeSymbol(symbol.providerSymbol)))\\n    : universe.symbolMeta);")'
          if old not in script:
              raise SystemExit('current recommendations-route adaptation target was not found')
          Path('/tmp/apply.sh').write_text(script.replace(old, new, 1))
          PYTHON
          bash /tmp/apply.sh
