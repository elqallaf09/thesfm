name: Apply signal card completeness fix

on:
  push:
    branches:
      - fix/signal-card-evidence-20260916
    paths:
      - .github/workflows/apply-signal-card-fix.yml
      - tools/apply_signal_card_fix.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/signal-card-evidence-20260916
      - name: Sync current main and apply signal fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python tools/apply_signal_card_fix.py
