name: SFM TV Android APK (Preview)
on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/markets-tv/**'
      - 'scripts/build-markets-tv.mjs'
      - '.github/workflows/sfm-tv-preview-apk.yml'
permissions:
  contents: read
jobs:
  build-preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle SFM TV web assets into Android
        run: pnpm build:tv
      - name: Build installable preview APK (debug signed)
        working-directory: apps/markets-tv/android
        run: gradle --no-daemon :app:assemblePreviewDebug
      - name: Verify APK exists
        run: test -s apps/markets-tv/android/app/build/outputs/apk/preview/debug/app-preview-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SFM-TV-Android-TV-preview-APK
          path: apps/markets-tv/android/app/build/outputs/apk/preview/debug/*.apk
          if-no-files-found: error
          retention-days: 14
