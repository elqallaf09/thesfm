name: SFM TV Android APK (Preview)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/markets-tv/**'
      - 'src/components/markets-tv/**'
      - 'src/lib/markets-tv/**'
      - 'src/app/tv/**'
      - 'src/lib/assetVisuals.ts'
      - 'src/lib/metalVisuals.ts'
      - 'src/lib/market/assetAliases.ts'
      - 'src/lib/market/globalMarketStrips.ts'
      - 'src/styles/**'
      - 'public/markets-tv/**'
      - 'public/brand/sfm-original-logo.png'
      - 'public/icons/icon-192.png'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'scripts/build-markets-tv.mjs'
      - '.github/workflows/sfm-tv-preview-apk.yml'
  push:
    branches: [main]
    paths:
      - 'apps/markets-tv/**'
      - 'src/components/markets-tv/**'
      - 'src/lib/markets-tv/**'
      - 'src/app/tv/**'
      - 'src/lib/assetVisuals.ts'
      - 'src/lib/metalVisuals.ts'
      - 'src/lib/market/assetAliases.ts'
      - 'src/lib/market/globalMarketStrips.ts'
      - 'src/styles/**'
      - 'public/markets-tv/**'
      - 'public/brand/sfm-original-logo.png'
      - 'public/icons/icon-192.png'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'patches/**'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'scripts/build-markets-tv.mjs'
      - '.github/workflows/sfm-tv-preview-apk.yml'
permissions:
  contents: read
concurrency:
  group: sfm-tv-preview-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build-preview-apk:
    name: Build SFM TV debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle SFM TV web assets into Android
        run: pnpm build:tv
      # Browser tests and release compilation retain their own workflow gates.
      # This debug artifact can be produced while those longer checks are pending.
      - name: Build installable preview APK
        working-directory: apps/markets-tv/android
        run: gradle --no-daemon :app:assemblePreviewDebug
      - name: Verify APK exists and record its checksum
        run: |
          test -s apps/markets-tv/android/app/build/outputs/apk/preview/debug/app-preview-debug.apk
          sha256sum apps/markets-tv/android/app/build/outputs/apk/preview/debug/app-preview-debug.apk > SFM-TV-preview-debug.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: SFM-TV-Android-TV-preview-APK-${{ github.sha }}
          path: |
            apps/markets-tv/android/app/build/outputs/apk/preview/debug/app-preview-debug.apk
            SFM-TV-preview-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
