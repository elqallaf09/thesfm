name: Native Markets TV validation
on:
  pull_request:
    branches: [main]
    paths: ['apps/markets-tv-native/**', '.github/workflows/markets-tv-native.yml']
  workflow_dispatch:
    inputs:
      compile_native:
        description: 'Compile unsigned tvOS simulator app and Android test APK (no store upload)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: markets-tv-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/markets-tv-native
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: apps/markets-tv-native/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm prebuild:android && pnpm prebuild:tvos
      - run: pnpm exec expo export --platform android --platform ios --output-dir dist/validation
  android:
    if: github.event_name == 'workflow_dispatch' && inputs.compile_native
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile && pnpm prebuild:android
      - run: ./gradlew --no-daemon :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: apps/markets-tv-native/android
      - uses: actions/upload-artifact@v7
        with:
          name: sfm-native-tv-android-debug-TEST-ONLY
          path: apps/markets-tv-native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  tvos:
    if: github.event_name == 'workflow_dispatch' && inputs.compile_native
    needs: validate
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - run: pnpm install --frozen-lockfile && pnpm prebuild:tvos
      - run: pod install --project-directory=ios
      - run: xcodebuild -workspace ios/SFMMarketsTV.xcworkspace -scheme SFMMarketsTV -sdk appletvsimulator -configuration Release -derivedDataPath .native-build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v7
        with:
          name: sfm-native-tv-tvos-simulator-NOT-DEVICE-INSTALLABLE
          path: apps/markets-tv-native/.native-build/Build/Products/Release-appletvsimulator/*.app
          if-no-files-found: error
