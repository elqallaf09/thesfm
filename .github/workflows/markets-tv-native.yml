name: Native Markets TV validation
on:
  pull_request:
    branches: [main]
    paths: ['apps/markets-tv-native/**', '.github/workflows/markets-tv-native.yml']
  workflow_dispatch:
    inputs:
      compile_native:
        description: 'Compile unsigned tvOS simulator app and Android test APK (no store upload)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: markets-tv-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/markets-tv-native
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: apps/markets-tv-native/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm prebuild:android && pnpm prebuild:tvos
      - run: pnpm exec expo export --platform android --platform ios --output-dir dist/validation
  android:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.compile_native)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile && pnpm prebuild:android
      - run: ./gradlew --no-daemon :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: apps/markets-tv-native/android
      - uses: actions/upload-artifact@v7
        with:
          name: sfm-native-tv-android-debug-TEST-ONLY
          path: apps/markets-tv-native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  tvos:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.compile_native)
    needs: validate
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - run: pnpm install --frozen-lockfile && pnpm prebuild:tvos
      - run: pod install --project-directory=ios
      - run: xcodebuild -workspace ios/SFMMarketsTV.xcworkspace -scheme SFMMarketsTV -sdk appletvsimulator -configuration Release -derivedDataPath .native-build CODE_SIGNING_ALLOWED=NO build
      - name: Launch on an Apple TV simulator
        run: |
          mkdir -p .native-build/smoke
          TV_SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k,vs in d.items() if "tvOS" in k for v in vs if v.get("isAvailable") and "Apple TV" in v["name"]))')"
          xcrun simctl boot "$TV_SIMULATOR_UDID"
          xcrun simctl bootstatus "$TV_SIMULATOR_UDID" -b
          TV_APP_PATH="$(find .native-build/Build/Products/Release-appletvsimulator -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$TV_APP_PATH"
          xcrun simctl install "$TV_SIMULATOR_UDID" "$TV_APP_PATH"
          xcrun simctl launch --terminate-running-process "$TV_SIMULATOR_UDID" com.thesfm.marketstv.native > .native-build/smoke/launch.txt
          sleep 10
          xcrun simctl spawn "$TV_SIMULATOR_UDID" launchctl list | grep -F com.thesfm.marketstv.native > .native-build/smoke/process.txt
          xcrun simctl io "$TV_SIMULATOR_UDID" screenshot .native-build/smoke/tvos-launch.png
          xcrun simctl shutdown "$TV_SIMULATOR_UDID"
      - uses: actions/upload-artifact@v7
        with:
          name: sfm-native-tv-tvos-simulator-NOT-DEVICE-INSTALLABLE
          path: |
            apps/markets-tv-native/.native-build/Build/Products/Release-appletvsimulator/*.app
            apps/markets-tv-native/.native-build/smoke
          if-no-files-found: error
