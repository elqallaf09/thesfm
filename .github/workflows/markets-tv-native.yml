name: Native Markets TV validation
on:
  pull_request:
    branches: [main]
    paths: ['apps/markets-tv-native/**', 'src/lib/markets-tv/**', '.github/workflows/markets-tv-native.yml', '.github/scripts/native-tv-smoke/**']
  workflow_dispatch:
    inputs:
      compile_native:
        description: 'Compile unsigned tvOS simulator app and Android test APK (no store upload)'
        type: boolean
        default: false
      runtime_artifact_id:
        description: 'Replay only: existing tvOS simulator artifact ID (leave empty for normal validation)'
        type: string
        default: ''
      runtime_run_id:
        description: 'Replay only: successful native workflow run that produced the artifact'
        type: string
        default: ''
      runtime_source_sha:
        description: 'Replay only: exact 40-character application source head SHA'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: markets-tv-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/markets-tv-native
jobs:
  validate:
    if: github.event_name != 'workflow_dispatch' || inputs.runtime_artifact_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: apps/markets-tv-native/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm prebuild:android && pnpm prebuild:tvos
      - run: pnpm exec expo export --platform android --platform ios --output-dir dist/validation
  android:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.compile_native && inputs.runtime_artifact_id == '')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile && pnpm prebuild:android
      - run: ./gradlew --no-daemon :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64
        working-directory: apps/markets-tv-native/android
      - uses: actions/upload-artifact@v7
        with:
          name: sfm-native-tv-android-debug-TEST-ONLY
          path: apps/markets-tv-native/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
  tvos:
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.compile_native && inputs.runtime_artifact_id == '')
    needs: validate
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - run: pnpm install --frozen-lockfile && pnpm prebuild:tvos
      - run: pod install --project-directory=ios
      - run: xcodebuild -workspace ios/SFMMarketsTV.xcworkspace -scheme SFMMarketsTV -sdk appletvsimulator -configuration Release -derivedDataPath .native-build CODE_SIGNING_ALLOWED=NO build
      - name: Launch on an Apple TV simulator
        run: |
          mkdir -p .native-build/smoke
          TV_SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(v["udid"] for k,vs in d.items() if "tvOS" in k for v in vs if v.get("isAvailable") and "Apple TV" in v["name"]))')"
          xcrun simctl boot "$TV_SIMULATOR_UDID"
          xcrun simctl bootstatus "$TV_SIMULATOR_UDID" -b
          TV_APP_PATH="$(find .native-build/Build/Products/Release-appletvsimulator -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$TV_APP_PATH"
          xcrun simctl install "$TV_SIMULATOR_UDID" "$TV_APP_PATH"
          xcrun simctl launch --terminate-running-process "$TV_SIMULATOR_UDID" com.thesfm.marketstv.native > .native-build/smoke/launch.txt
          sleep 10
          xcrun simctl spawn "$TV_SIMULATOR_UDID" launchctl list | grep -F com.thesfm.marketstv.native > .native-build/smoke/process.txt
          xcrun simctl io "$TV_SIMULATOR_UDID" screenshot .native-build/smoke/tvos-launch.png
          for TV_SCENE in brief map account; do
            xcrun simctl openurl "$TV_SIMULATOR_UDID" "sfm-tv-native://$TV_SCENE"
            sleep 10
            xcrun simctl spawn "$TV_SIMULATOR_UDID" launchctl list | grep -F com.thesfm.marketstv.native > ".native-build/smoke/$TV_SCENE-process.txt"
            xcrun simctl io "$TV_SIMULATOR_UDID" screenshot ".native-build/smoke/tvos-$TV_SCENE.png"
          done
          xcrun simctl shutdown "$TV_SIMULATOR_UDID"
      - uses: actions/upload-artifact@v7
        with:
          name: sfm-native-tv-tvos-simulator-NOT-DEVICE-INSTALLABLE
          path: |
            apps/markets-tv-native/.native-build/Build/Products/Release-appletvsimulator/*.app
            apps/markets-tv-native/.native-build/smoke
          if-no-files-found: error
      - name: Preserve native feature screenshots for review
        uses: actions/upload-artifact@v7
        with:
          name: sfm-native-tv-feature-screenshots
          path: apps/markets-tv-native/.native-build/smoke
          if-no-files-found: error

  runtime-replay:
    name: Verify existing native TV app screens
    if: github.event_name == 'workflow_dispatch' && inputs.runtime_artifact_id != ''
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - name: Verify the compiled app source and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TV_SOURCE_RUN_ID: ${{ inputs.runtime_run_id }}
          TV_SOURCE_ARTIFACT_ID: ${{ inputs.runtime_artifact_id }}
          TV_SOURCE_SHA: ${{ inputs.runtime_source_sha }}
          TV_COMPILE_NATIVE: ${{ inputs.compile_native }}
        run: python3 .github/scripts/native-tv-smoke/artifact_source.py .native-runtime/smoke/source.json
      - uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ inputs.runtime_artifact_id }}
          run-id: ${{ inputs.runtime_run_id }}
          github-token: ${{ github.token }}
          path: .native-runtime/prebuilt
      - name: Assert native feature rendering on Apple TV
        run: bash .github/scripts/native-tv-smoke/run.sh .native-runtime/prebuilt .native-runtime
      - name: Preserve feature screenshots and accessibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sfm-native-tv-feature-screenshots
          path: |
            .native-runtime/smoke
            .native-runtime/attachments
          if-no-files-found: error
      - name: Preserve XCTest result and runner build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sfm-native-tv-runtime-xcresult
          path: |
            .native-runtime/NativeTVSmoke.xcresult
            .native-runtime/xcodebuild.log
          if-no-files-found: error
