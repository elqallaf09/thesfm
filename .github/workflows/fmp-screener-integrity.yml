name: FMP Screener integrity
on:
  pull_request:
    paths:
      - 'src/lib/market/screenerPagination.ts'
      - 'scripts/check-fmp-screener.mjs'
      - '.github/workflows/fmp-screener-integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Verify live pages, replay and regional listing identity (read-only)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FMP_SCREENER_EXCHANGES: NASDAQ,KUWAIT,SAU,DFM,DOH,LSE,XETRA
        run: node --experimental-strip-types scripts/check-fmp-screener.mjs
