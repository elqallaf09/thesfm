name: SFM TV iPhone validation
on:
  pull_request:
    branches: [main]
    paths: ['apps/markets-tv-mobile/**', '.github/workflows/markets-tv-mobile.yml']
  push:
    branches: ['feat/sfm-tv-iphone-testflight']
    paths: ['apps/markets-tv-mobile/**', '.github/workflows/markets-tv-mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sfm-tv-iphone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    working-directory: apps/markets-tv-mobile
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm export:ios
      - run: pnpm exec expo prebuild --platform ios --no-install
      - uses: actions/upload-artifact@v7
        with:
          name: sfm-tv-iphone-validation-NOT-AN-IPA
          path: apps/markets-tv-mobile/.expo-validation/ios
          retention-days: 3
          if-no-files-found: error
