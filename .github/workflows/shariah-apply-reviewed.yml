name: Apply reviewed Shariah repair (temporary)
on:
  pull_request:
    types: [synchronize, reopened]
    paths:
      - 'scripts/shariah/repair-payload/**'
      - '.github/workflows/shariah-apply-reviewed.yml'
permissions:
  contents: write
jobs:
  apply:
    if: >-
      github.event.pull_request.number == 122 &&
      github.event.pull_request.head.repo.full_name == 'elqallaf09/thesfm' &&
      github.event.pull_request.head.ref == 'fix/shariah-auto-screening-refresh'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Apply only the hash-verified reviewed repair
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          root = pathlib.Path.cwd().resolve()
          payload_paths = [f'scripts/shariah/repair-payload/{i:02}.b64' for i in range(24)]
          temporary = payload_paths + ['.github/workflows/shariah-apply-reviewed.yml']
          compressed = base64.b64decode(''.join(pathlib.Path(p).read_text() for p in payload_paths), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '203d6dce91af0d9b861ab285946ec66d2fd89c8aa191a5447f95b063734cd34e', 'Payload hash mismatch'
          entries = json.loads(gzip.decompress(compressed))
          assert len(entries) == 44
          seen = set()
          for entry in entries:
              name = entry['path']
              path = pathlib.Path(name)
              assert name not in seen and not path.is_absolute() and '..' not in path.parts
              assert name.startswith(('src/', 'scripts/shariah/', 'supabase/migrations/')) or name == 'vercel.json'
              assert not path.is_symlink() and (root / path).resolve().is_relative_to(root)
              seen.add(name)
              if entry['base'] is None:
                  assert not path.exists(), f'Concurrent new file: {name}'
                  old = b''
              else:
                  old = path.read_bytes()
                  actual = subprocess.check_output(['git', 'hash-object', '--stdin'], input=old).decode().strip()
                  assert actual == entry['base'], f'Base mismatch: {name}'
              lines = old.decode('utf-8').splitlines(keepends=True)
              for start, end, replacement in reversed(entry['edits']):
                  assert 0 <= start <= end <= len(lines)
                  lines[start:end] = [replacement]
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(''.join(lines).encode('utf-8'))
          subprocess.run(['git', 'add', '--', *sorted(seen)], check=True)
          subprocess.run(['git', 'rm', '--cached', '--', *temporary], check=True)
          actual_tree = subprocess.check_output(['git', 'write-tree']).decode().strip()
          assert actual_tree == '26ad3f3ec3794aec931b930c6901e6837b82eaab', f'Final tree mismatch: {actual_tree}'
          # The connector removes these files in the next commit. The Actions token
          # never edits workflow files and cannot merge or bypass branch protection.
          subprocess.run(['git', 'reset', 'HEAD', '--', *temporary], check=True)
          print('Verified 44 reviewed patches; final cleanup tree:', actual_tree)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(shariah): validate source evidence and connect persisted refresh pipeline'
          git push origin HEAD:fix/shariah-auto-screening-refresh
