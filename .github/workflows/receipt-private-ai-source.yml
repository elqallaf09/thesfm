name: Receipt private AI source snapshot

on:
  push:
    branches: [fix/ai-workspace-providers-layout-20260916]
    paths:
      - .github/workflows/receipt-private-ai-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Collect exact tracked receipt integration sources
        run: |
          set -euo pipefail
          mkdir -p snapshot
          for path in \
            src/app/api/ai/receipt-scan/route.ts \
            src/app/api/receipts/scan/route.ts \
            src/lib/server/receiptProviderConfig.ts \
            src/lib/routeDashboard/helpers.ts \
            src/lib/routeDashboard/types.ts \
            src/components/finance/RouteDashboardPage.tsx \
            .env.example; do
            mkdir -p "snapshot/$(dirname "$path")"
            cp "$path" "snapshot/$path"
          done
          mkdir -p snapshot/src/__tests__/unit
          find src/__tests__/unit -maxdepth 1 -type f \( -iname '*receipt*' -o -iname '*Receipt*' \) -print0 | while IFS= read -r -d '' path; do cp "$path" "snapshot/$path"; done
          printf '%s\n' "${GITHUB_SHA}" > snapshot/HEAD_SHA
      - uses: actions/upload-artifact@v7
        with:
          name: receipt-private-ai-source
          path: snapshot/
          retention-days: 1
