name: Trader accessibility source inspection
on:
  push:
    branches: [fix/trader-accessibility-followup]
    paths: [.github/workflows/trader-a11y-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a596923c50f0759bb147e35670bd2868f9d7de60
      - name: Archive exact tracked baseline only
        run: |
          mkdir -p /tmp/trader-a11y-source
          git archive --format=tar HEAD > /tmp/trader-a11y-source/baseline.tar
          git rev-parse HEAD > /tmp/trader-a11y-source/commit.txt
          git rev-parse HEAD^{tree} > /tmp/trader-a11y-source/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trader-accessibility-source
          path: /tmp/trader-a11y-source/
          retention-days: 1
          if-no-files-found: error
