name: Shariah official source audit
on:
  push:
    branches: [fix/shariah-evidence-coverage-production-proof]
    paths: ['.github/workflows/shariah-source-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve public source samples without credentials or production writes
        shell: bash
        run: |
          mkdir -p sources
          python3 - <<'PY'
          import json, pathlib, time, urllib.request, urllib.parse, re
          out=pathlib.Path('sources'); report=[]
          def get(name,url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'THE-SFM admin@the-sfm.com','Accept':'application/json,text/html,application/pdf,*/*'})
              with urllib.request.urlopen(req,timeout=25) as r:
                body=r.read(15000001)
                if len(body)>15000000: raise ValueError('source_size_limit')
                (out/name).write_bytes(body)
                report.append({'name':name,'url':url,'finalUrl':r.url,'status':r.status,'bytes':len(body)})
                return body
            except Exception as e: report.append({'name':name,'url':url,'error':str(e)[:240]})
            finally: time.sleep(.3)
          for ticker,cik in [('AAPL','0000320193'),('MSFT','0000789019'),('NVDA','0001045810'),('BAC','0000070858'),('KO','0000021344')]:
            get(ticker+'-facts.json',f'https://data.sec.gov/api/xbrl/companyfacts/CIK{cik}.json')
            data=get(ticker+'-submissions.json',f'https://data.sec.gov/submissions/CIK{cik}.json')
            if data:
              recent=json.loads(data).get('filings',{}).get('recent',{})
              for i,form in enumerate(recent.get('form',[])):
                if form in ('10-K','10-Q'):
                  acc=recent['accessionNumber'][i].replace('-','')
                  get(ticker+'-current.html',f'https://www.sec.gov/Archives/edgar/data/{int(cik)}/{acc}/{recent["primaryDocument"][i]}')
                  break
          for name,url in [
            ('KFH-annual.html','https://www.kfh.com/en/home/Investor-Relations/Annual-Reports/Annual-Reports.html'),
            ('NBK-ir.html','https://www.nbk.com/investor-relations.html'),
            ('DFM-sharia.html','https://www.dfm.ae/the-exchange/statistics-reports/sharia-classification-list'),
            ('IWM.html','https://www.ishares.com/us/products/239710/'),
            ('SPY.html','https://www.ssga.com/us/en/individual/etfs/spdr-sp-500-etf-trust-spy')]:
            body=get(name,url)
            if body:
              text=body.decode('utf-8','replace')
              links=[urllib.parse.urljoin(url,x) for x in re.findall(r'(?:href|src)=[\"\x27]([^\"\x27]+)',text)]
              (out/(name+'.links.json')).write_text(json.dumps([x for x in links if re.search(r'(2025|2026|\.pdf|\.csv|\.xlsx|sharia|classification|holdings)',x,re.I)],indent=2))
          (out/'manifest.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shariah-official-source-audit
          path: sources
          retention-days: 1
