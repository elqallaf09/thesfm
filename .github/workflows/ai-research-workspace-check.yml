name: Unified AI research workspace
on:
  push:
    branches: [fix/ai-workspace-providers-layout-20260916]
permissions:
  contents: read
concurrency:
  group: unified-ai-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Unified research guest browsers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: https://www.the-sfm.com
      PLAYWRIGHT_WEB_SERVER_COMMAND: pnpm run start
      PLAYWRIGHT_NO_COPY_PROMPT: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm build
      - name: Verify unified flow and rules card in three languages and browsers
        run: >-
          pnpm exec playwright test tests/smoke/ai-analyst-unified-research.spec.ts
          --no-deps --project=chromium-desktop --project=mobile-chrome --project=mobile-webkit
      - name: Remove DOM error context
        if: always()
        run: find test-results -type f -name 'error-context.md' -delete 2>/dev/null || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unified-research-browser-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
