name: Drawer asset compatibility repair
on:
  push:
    branches: [fix/trader-accessibility-followup]
    paths: [.github/workflows/drawer-version-compatibility.yml]
permissions:
  contents: write
  actions: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/trader-accessibility-followup
          fetch-depth: 0
      - name: Apply checksum-verified cache version compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          checks={
            'index.html':('2da464e052cddd67abcd565ee66be289a1315e20cfeabe2ad4f14fbbc4b8e513','cc0cfe6c73efd6730b30fe750ceffd6e12ae4028f938129ae023f09cae1d6ace'),
            'detail.html':('c655465d172003902cffee28a35fedf76c590f94985674669eb7421efcd712e1','5230e3b6ff82693384bf0ff6f472c6f42dd957c1dd1b53eac78e44557e61cb6b'),
            'service-worker.js':('9930d3d468dd4de71af3f673500433abf7681f594ad54bc31a1ae3ea0defbbce','20fdad8766880f7ba5ad5b49e5add5cf8ded0fc846ec94c88e220f3e022a52bc')
          }
          for name,(before,after) in checks.items():
            p=Path('src/trader-app/public')/name
            assert hashlib.sha256(p.read_bytes()).hexdigest()==before,name
            p.write_text(p.read_text().replace('20260916-drawer-focus','20260717-shell-unify-drawer-20260916'))
            assert hashlib.sha256(p.read_bytes()).hexdigest()==after,name
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/trader-app/public/index.html src/trader-app/public/detail.html src/trader-app/public/service-worker.js
          git commit -m 'fix(trader): preserve established asset generation while busting drawer caches'
          git push origin HEAD:refs/heads/fix/trader-accessibility-followup
      - name: Capture the original public job diagnostic bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/drawer-unit-diagnostic
          gh api repos/elqallaf09/thesfm/actions/jobs/104680226086/logs > /tmp/drawer-unit-diagnostic/unit.log
      - uses: actions/upload-artifact@v4
        with:
          name: drawer-unit-diagnostic
          path: /tmp/drawer-unit-diagnostic/
          retention-days: 1
          if-no-files-found: error
