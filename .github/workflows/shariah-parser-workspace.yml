name: Shariah parser workspace
on:
  push:
    branches: [fix/shariah-evidence-coverage-production-proof]
    paths: ['.github/workflows/shariah-parser-workspace.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: pnpm add --save-exact saxes@6.0.0
      - name: Package parser dependencies and lockfile for isolated verification
        run: |
          mkdir -p prepared
          cp package.json pnpm-lock.yaml prepared/
          tar -czf prepared/parser-dependencies.tar.gz node_modules/.pnpm/saxes@6.0.0 node_modules/.pnpm/xmlchars@2.2.0 node_modules/saxes
      - name: Retrieve only public official evidence samples
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, json, re, time, urllib.parse
          out=pathlib.Path('prepared'); report=[]
          urls=[
          ('NBK-financials.pdf','https://www.nbk.com/dam/jcr:74a4e6f5-e954-4328-a26a-3610ae1a1c13/nbk-financial-statements-2025-e.pdf'),
          ('SPY-holdings.xlsx','https://www.ssga.com/library-content/products/fund-data/etfs/us/holdings-daily-us-en-spy.xlsx'),
          ('DFM-app.js','https://www.dfm.ae/_nuxt/BQVMMCnB.js'),
          ('KFH-page.html','https://www.kfh.com/en/home/Investor-Relations/Annual-Reports/Annual-Reports.html')]
          def get(name,url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'THE-SFM admin@the-sfm.com'})
              with urllib.request.urlopen(req,timeout=30) as r:
                b=r.read(20000001)
                if len(b)>20000000: raise ValueError('size_limit')
                (out/name).write_bytes(b)
                report.append({'file':name,'url':url,'status':r.status,'bytes':len(b)})
                return b
            except Exception as e: report.append({'file':name,'url':url,'error':str(e)[:200]})
            finally: time.sleep(.3)
          for name,url in urls:
            body=get(name,url)
            if name=='KFH-page.html' and body:
              html=body.decode('utf8','replace')
              links=list(dict.fromkeys(urllib.parse.urljoin(url,x) for x in re.findall(r'href=[\"\x27]([^\"\x27]+)',html) if re.search(r'2025',x) and re.search(r'pdf',x,re.I)))
              for i,u in enumerate(links[:3]): get(f'KFH-report-{i}.pdf',u)
          (out/'source-manifest.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shariah-parser-prepared
          path: prepared
          retention-days: 1
