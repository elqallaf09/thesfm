name: Apply reviewed Trader evidence repair
on:
  push:
    branches: [fix/watchlist-owned-engine-20260915]
    paths: [.github/workflows/trader-evidence-repair-bootstrap.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'elqallaf09/thesfm' && github.ref == 'refs/heads/fix/watchlist-owned-engine-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Apply content-verified narrow repair
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, json, hashlib, subprocess
          from pathlib import Path
          encoded = ''
          # The compressed patch is transport only, never an executable remote download.
          raw = gzip.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(raw).hexdigest() == '4cc2f892a7a9e72c29ca6916f13bec98c0623bcf9786d2ea45c44895d8f54db6'
          data = json.loads(raw)
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^') == data['base'], 'Branch moved; re-review required'
          for name, sha in data['expectedBlobs'].items(): assert git('hash-object',name) == sha, name
          outputs = {}
          for name, replacements in data['changes'].items():
              text = Path(name).read_text()
              for item in replacements:
                  assert text.count(item['old']) == 1, (name,item['old'][:80])
                  text = text.replace(item['old'],item['new'])
              outputs[name] = text
          for name in data['bumpPaths']:
              text = outputs.get(name,Path(name).read_text())
              assert '20260915-watchlist-engine-1' in text, name
              outputs[name] = text.replace('20260915-watchlist-engine-1','20260915-watchlist-engine-2')
          for name in ['src/trader-app/public/index.html','src/trader-app/public/detail.html','src/trader-app/public/service-worker.js']:
              text = outputs.get(name,Path(name).read_text())
              text = text.replace('/recommendation.js?v=20260712-density','/recommendation.js?v=20260712-density-signal-gate-20260915')
              text = text.replace('/detail.js?v=20260714-phase34','/detail.js?v=20260714-phase34-signal-gate-20260915')
              outputs[name] = text
          for name, suffix in data['append'].items(): outputs[name] = Path(name).read_text()+suffix
          for name, text in data['newFiles'].items():
              assert not Path(name).exists(), name
              outputs[name] = text
          for name, text in outputs.items():
              Path(name).parent.mkdir(parents=True,exist_ok=True)
              Path(name).write_text(text)
          Path('.github/workflows/trader-evidence-repair-bootstrap.yml').unlink()
          print('Applied',len(outputs),'reviewed files; no secrets, settings, data migrations, or branch rules changed.')
          PY
      - name: Validate actual repaired JavaScript and evidence regressions
        run: |
          node --check src/trader-app/public/recommendation.js
          node --check src/trader-app/public/detail.js
          node --check src/trader-app/public/app.js
          node --check src/trader-app/public/watchlist-view.js
          node --test tests/engine/trader-signal-evidence.test.mjs
          git diff --check
      - name: Commit final source and remove this one-time transport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/trader-app/public src/__tests__/unit/traderDensity.test.ts src/__tests__/unit/traderDetailVisualSystem.test.ts src/__tests__/unit/traderWorkspaceExperience.test.ts tests/engine/trader-signal-evidence.test.mjs tests/smoke/trader-watchlist-engine.spec.ts .github/workflows/trader-evidence-repair-bootstrap.yml
          git commit -m 'fix(trader): gate strong signals on source evidence and share watchlist drawer data'
          git push origin HEAD:fix/watchlist-owned-engine-20260915
