name: Inspect remaining official Shariah sources
on:
  push:
    branches: [fix/shariah-remaining-source-coverage]
    paths: ['.github/workflows/shariah-coverage-inspect.yml', 'src/__tests__/integration/shariahSourceInspection.test.ts']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: pnpm install --frozen-lockfile
      - name: Inspect public source layouts without production access
        env:
          SFM_SOURCE_INSPECT: '1'
          SEC_USER_AGENT: 'THE-SFM admin@the-sfm.com'
        run: pnpm exec vitest run src/__tests__/integration/shariahSourceInspection.test.ts --maxWorkers=1
