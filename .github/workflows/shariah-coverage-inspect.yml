name: Inspect remaining official Shariah sources
on:
  push:
    branches: [fix/shariah-remaining-source-coverage]
permissions:
  contents: read
concurrency:
  group: shariah-coverage-inspect
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: pnpm install --frozen-lockfile
      - name: Specialized regression tests
        run: pnpm exec vitest run src/__tests__/unit/*[sS]haria*.test.ts --maxWorkers=2
      - name: TypeScript
        if: ${{ !cancelled() }}
        run: pnpm exec tsc --noEmit --pretty false
      - name: Inspect public source layouts without production access
        if: ${{ !cancelled() }}
        env:
          SFM_SOURCE_INSPECT: '1'
          SEC_USER_AGENT: 'THE-SFM admin@the-sfm.com'
        run: pnpm exec vitest run src/__tests__/integration/shariahSourceInspection.test.ts --maxWorkers=1
