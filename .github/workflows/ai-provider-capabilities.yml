name: AI provider capability diagnostic
on:
  push:
    branches: [fix/ai-workspace-providers-layout-20260916]
    paths: [.github/workflows/ai-provider-capabilities.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/github-script@v8
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          script: |
            // No changes to credentials, billing, allowlists, or account policy.
            // Decrypt only the exact AI keys below; never publish raw responses.
            const project = 'prj_AumPZoHxwpIUVJID2gQBx30ZmciV';
            const team = 'team_bbZHtZJklSZDa3vvhiG5B7PL';
            const names = ['AI_GATEWAY_API_KEY', 'AI_GATEWAY_TOKEN', 'ANTHROPIC_API_KEY', 'AI_ASSISTANT_GATEWAY_MODEL', 'AI_ASSISTANT_ANTHROPIC_MODEL'];
            const report = [];
            if (!process.env.VERCEL_TOKEN?.trim()) {
              core.setFailed('MISSING_VERCEL_MANAGEMENT_CREDENTIAL: existing VERCEL_TOKEN is unavailable; no settings were read or changed.');
              return;
            }
            const vercel = async path => {
              const url = new URL(path, 'https://api.vercel.com');
              url.searchParams.set('teamId', team);
              const response = await fetch(url, { headers: { authorization: `Bearer ${process.env.VERCEL_TOKEN.trim()}` }, redirect: 'error', signal: AbortSignal.timeout(12000) });
              if (!response.ok) throw new Error(`VERCEL_MANAGEMENT_HTTP_${response.status}`);
              return response.json();
            };
            const clean = value => {
              let text = typeof value === 'string' ? value.trim() : '';
              if ((text.startsWith('"') && text.endsWith('"')) || (text.startsWith("'") && text.endsWith("'"))) text = text.slice(1, -1).trim();
              return /[\r\n]/.test(text) ? '' : text;
            };
            const safeCause = (status, payload) => {
              const e = payload?.error || {};
              const message = String(e.message || '');
              if (status === 401) return 'AUTHENTICATION_FAILED';
              if (/free.*credit|free tier|paid credits|RestrictedModelsError/i.test(message + String(e.param?.name || ''))) return 'GATEWAY_CREDIT_TIER_RESTRICTION';
              if (/allowlist|restricted access to this provider/i.test(message)) return 'PROVIDER_ALLOWLIST_RESTRICTION';
              if (status === 402 || /insufficient.*credit|credit balance/i.test(message)) return 'BILLING_REQUIRED';
              if (e.type === 'no_providers_available') return 'NO_PROVIDERS_AVAILABLE';
              if (status === 429) return 'RATE_LIMIT_OR_QUOTA';
              if (status === 404) return 'MODEL_NOT_AVAILABLE';
              return status >= 200 && status < 300 ? 'SUCCESS' : 'PROVIDER_REQUEST_FAILED';
            };
            try {
              const listing = await vercel(`/v10/projects/${project}/env?decrypt=false`);
              const values = {};
              for (const name of names) {
                const candidates = (listing.envs || []).filter(e => e.key === name && !e.gitBranch && (e.target || []).includes('production'));
                if (candidates.length !== 1) { report.push({ setting: name, status: candidates.length ? 'AMBIGUOUS' : 'NOT_SET' }); continue; }
                const meta = candidates[0];
                const item = await vercel(`/v1/projects/${project}/env/${encodeURIComponent(meta.id)}`);
                if (typeof item.value !== 'string') { report.push({ setting: name, status: 'RUNTIME_ONLY_OR_UNREADABLE' }); continue; }
                core.setSecret(item.value);
                values[name] = clean(item.value);
                if (values[name]) core.setSecret(values[name]);
                report.push({ setting: name, status: values[name] ? 'PRESENT' : 'INVALID_FORMAT', normalized: item.value !== values[name] });
              }
              const probe = async (provider, model, key) => {
                const gateway = provider === 'gateway';
                try {
                  const response = await fetch(gateway ? 'https://ai-gateway.vercel.sh/v1/chat/completions' : 'https://api.anthropic.com/v1/messages', {
                    method: 'POST', redirect: 'error', signal: AbortSignal.timeout(12000),
                    headers: gateway ? { 'content-type': 'application/json', authorization: `Bearer ${key}` } : { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
                    body: JSON.stringify({ model, max_tokens: 20, messages: [{ role: 'user', content: 'Reply with OK only.' }] }),
                  });
                  const payload = await response.json().catch(() => ({}));
                  const text = gateway ? payload.choices?.[0]?.message?.content : payload.content?.find(part => part.type === 'text')?.text;
                  report.push({ provider, model, status: response.status, cause: safeCause(response.status, payload), nonemptyReply: typeof text === 'string' && text.trim().length > 0 });
                } catch { report.push({ provider, model, cause: 'TRANSPORT_FAILED_OR_TIMEOUT' }); }
              };
              const gatewayKey = values.AI_GATEWAY_API_KEY || values.AI_GATEWAY_TOKEN;
              if (gatewayKey) {
                for (const model of [...new Set([values.AI_ASSISTANT_GATEWAY_MODEL || 'anthropic/claude-opus-5', 'anthropic/claude-haiku-4.5', 'openai/gpt-4o-mini'])]) {
                  if (!/^[a-zA-Z0-9/_.-]{1,120}$/.test(model)) continue;
                  await probe('gateway', model, gatewayKey);
                }
              }
              if (values.ANTHROPIC_API_KEY) await probe('anthropic', values.AI_ASSISTANT_ANTHROPIC_MODEL || 'claude-haiku-4-5-20251001', values.ANTHROPIC_API_KEY);
              core.info(JSON.stringify(report));
              await core.summary.addHeading('AI provider capability evidence; no settings changed').addCodeBlock(JSON.stringify(report, null, 2), 'json').write();
            } catch (error) {
              const message = String(error?.message || '');
              core.setFailed(/^VERCEL_MANAGEMENT_HTTP_\d{3}$/.test(message) ? message : 'DIAGNOSTIC_FAILED_NO_SECRET_DETAILS');
            }
