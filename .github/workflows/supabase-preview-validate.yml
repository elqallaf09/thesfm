name: Supabase Preview Validate

# On-demand, target-agnostic Preview validation. Unlike the required PR gates
# in ci.yml, this workflow can validate an arbitrary already-open PR (by
# number) without needing a new commit on that PR, and does not depend on the
# external "Supabase Preview" GitHub check (Supabase's own branch-per-PR
# integration), which is not reliable for this repository today — see
# docs/infra/supabase-preview-ci.md for the full root-cause writeup.
#
# This workflow deliberately fails closed rather than silently skipping when
# a required credential is missing. See the "validate-required-secrets" job.

on:
  workflow_dispatch:
    inputs:
      target_pr:
        description: "Pull request number to validate (e.g. 53). Mutually exclusive with target_sha."
        required: false
        type: string
      target_sha:
        description: "Exact commit SHA to validate. Mutually exclusive with target_pr."
        required: false
        type: string

permissions:
  contents: read
  deployments: read
  checks: read
  pull-requests: read

concurrency:
  group: supabase-preview-validate-${{ inputs.target_pr || inputs.target_sha }}
  cancel-in-progress: true

jobs:
  resolve-target:
    name: Resolve target PR / exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Resolve exact target SHA
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const targetPr = `${{ inputs.target_pr }}`.trim();
            const targetSha = `${{ inputs.target_sha }}`.trim();
            if (!targetPr && !targetSha) {
              core.setFailed('Provide either target_pr or target_sha.');
              return;
            }
            if (targetPr && targetSha) {
              core.setFailed('Provide only one of target_pr or target_sha, not both.');
              return;
            }
            if (targetPr) {
              if (!/^\d+$/.test(targetPr)) {
                core.setFailed('target_pr must be a plain PR number, e.g. 53.');
                return;
              }
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: Number(targetPr),
              });
              core.setOutput('sha', pr.head.sha);
              core.setOutput('pr_number', String(pr.number));
              core.info(`Resolved PR #${pr.number} to exact head SHA ${pr.head.sha}.`);
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(targetSha)) {
              core.setFailed('target_sha must be a full 40-character commit SHA.');
              return;
            }
            core.setOutput('sha', targetSha);
            core.setOutput('pr_number', '');
            core.info(`Using explicit target SHA ${targetSha}.`);

  validate-required-secrets:
    name: Validate required secrets (names only, fail closed)
    needs: [resolve-target]
    runs-on: ubuntu-latest
    environment: Preview
    timeout-minutes: 2
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PREVIEW_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_PREVIEW_SERVICE_ROLE_KEY }}
      SUPABASE_PRODUCTION_REF: ${{ vars.SUPABASE_PRODUCTION_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check every capability this workflow needs, by name only
        shell: bash
        run: |
          missing=()
          note() { echo "  - $1: $2"; }

          [[ -z "${CRON_SECRET:-}" ]] && missing+=("CRON_SECRET (GitHub Actions secret) — required to authenticate the scanner-route request; the app's CRON_SECRET is currently only configured in Vercel's environment, not mirrored as a GitHub Actions secret")
          [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]] && missing+=("VERCEL_AUTOMATION_BYPASS_SECRET — required to bypass Vercel Deployment Protection")
          [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]] && missing+=("SUPABASE_ACCESS_TOKEN — a Supabase Management API personal/project access token, required for 'supabase link' and 'supabase migration list' against the Preview branch; distinct from SUPABASE_PREVIEW_SERVICE_ROLE_KEY, which is a Data API key and cannot perform branch/migration management")
          [[ -z "${SUPABASE_PREVIEW_SERVICE_ROLE_KEY:-}" ]] && missing+=("SUPABASE_PREVIEW_SERVICE_ROLE_KEY — required to read/write trader_cache rows for the cursor/lock validation")
          [[ -z "${SUPABASE_PRODUCTION_REF:-}" ]] && missing+=("SUPABASE_PRODUCTION_REF (repository variable) — required for the fail-closed non-Production identity assertion")
          [[ -z "${VERCEL_TOKEN:-}" ]] && missing+=("VERCEL_TOKEN — a Vercel API token, required to read function logs/duration/CPU metrics for the exact Preview deployment; not currently configured anywhere in this repository")

          {
            echo "### Supabase Preview Validate — required secrets check"
            echo ""
            if (( ${#missing[@]} > 0 )); then
              echo "**Result: FAILED CLOSED — ${#missing[@]} required secret(s)/variable(s) missing.**"
              echo ""
              echo "| Missing capability | Why it's needed |"
              echo "|---|---|"
              for m in "${missing[@]}"; do
                echo "| \`${m%% —*}\` | ${m#*— } |"
              done
              echo ""
              echo "**Next step:** add each one under Settings > Secrets and variables > Actions"
              echo "(repository-level, or the \`Preview\` environment), then re-run this workflow"
              echo "via workflow_dispatch. No downstream validation ran."
            else
              echo "**Result: all required secrets/variables present.** (names only checked; no values printed)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if (( ${#missing[@]} > 0 )); then
            echo "::error::This workflow cannot run the full Preview validation pipeline because ${#missing[@]} required secret(s)/variable(s) are missing:"
            for m in "${missing[@]}"; do
              echo "::error::  - $m"
            done
            echo ""
            echo "Manual configuration step: add each missing secret/variable in"
            echo "  Settings > Secrets and variables > Actions (repo-level, or the 'Preview' environment)"
            echo "for this repository, then re-run this workflow via workflow_dispatch."
            exit 1
          fi

          echo "All required secrets/variables are present (names only checked; values never printed)."

  # The jobs below are intentionally NOT marked "needs: validate-required-secrets"
  # with a soft dependency — they hard-depend on it so that a missing secret
  # fails the whole run closed instead of silently skipping to a green
  # checkmark. See validate-required-secrets above for exactly what is missing
  # today in this repository.

  snapshot-upgrade:
    name: Snapshot-upgrade migration validation (Section B)
    needs: [resolve-target, validate-required-secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PRODUCTION_REF: ${{ vars.SUPABASE_PRODUCTION_REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}

      - name: Resolve the isolated Supabase Preview ref for this exact SHA
        id: preview-ref
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ needs.resolve-target.outputs.sha }}';
            const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: sha, per_page: 100 });
            const preview = data.check_runs.find(c => c.name === 'Supabase Preview' && c.app?.slug === 'supabase');
            if (!preview || preview.conclusion !== 'success') {
              core.setFailed(`No successful "Supabase Preview" branch exists for ${sha} (status: ${preview?.conclusion ?? 'none'}). This job validates an existing branch's migration state — it does not provision one. See docs/infra/supabase-preview-ci.md.`);
              return;
            }
            const url = new URL(preview.details_url);
            const match = url.pathname.match(/^\/dashboard\/project\/([a-z0-9]{20})\/?$/);
            if (!match) {
              core.setFailed('Could not parse an isolated Supabase project ref from the Preview check.');
              return;
            }
            core.setOutput('ref', match[1]);

      - name: Fail-closed identity assertion — target must never be Production
        run: |
          if [[ "${{ steps.preview-ref.outputs.ref }}" == "${SUPABASE_PRODUCTION_REF}" ]]; then
            echo "::error::Resolved Preview ref matches SUPABASE_PRODUCTION_REF. Refusing to proceed."
            exit 1
          fi
          echo "Confirmed target ref ${{ steps.preview-ref.outputs.ref }} is not the Production ref."

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Install the Supabase CLI
        run: pnpm dlx supabase --version

      - name: Link to the isolated Preview project (never Production)
        run: pnpm dlx supabase link --project-ref "${{ steps.preview-ref.outputs.ref }}"

      - name: List local-vs-remote migration status
        id: migration-list
        run: |
          pnpm dlx supabase migration list --linked > migration-status.txt
          cat migration-status.txt

      - name: Apply only genuinely unapplied migration versions
        run: |
          # `supabase db push` only applies local migrations that are not yet
          # present in the target's supabase_migrations.schema_migrations
          # table — it never blindly replays the full directory. This is the
          # mechanism, not a custom replay loop.
          pnpm dlx supabase db push --linked

      - name: Re-verify clean status after push
        run: |
          pnpm dlx supabase migration list --linked > migration-status-after.txt
          if grep -qi "not applied\|missing" migration-status-after.txt; then
            echo "::error::Migration history is still inconsistent after db push. Reporting and failing closed rather than guessing."
            cat migration-status-after.txt
            exit 1
          fi
          echo "Migration history is consistent: every local migration version is recorded as applied."

  cleanup:
    name: Cleanup workflow-owned Preview fixtures
    needs: [resolve-target, snapshot-upgrade]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: No fixtures to clean in this run
        run: |
          echo "This workflow currently only validates migration history (Section B)."
          echo "It creates no scanner cursor/lock test rows or other fixtures itself —"
          echo "those are created by the scanner-specific validation steps, which are"
          echo "blocked pending the missing secrets reported above."
