name: Trader contrast inspection snapshot
on:
  push:
    branches: [fix/trader-readable-light-theme]
    paths: [.github/workflows/trader-contrast-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3fa56a273c5412b067d3eee0da1b8befd78fd0ad
          persist-credentials: false
      - name: Archive tracked source at the inspected revision
        run: |
          mkdir -p /tmp/trader-contrast
          git archive --format=tar.gz --output=/tmp/trader-contrast/source.tar.gz HEAD
          git rev-parse HEAD > /tmp/trader-contrast/revision.txt
          git ls-tree -r HEAD > /tmp/trader-contrast/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trader-contrast-source
          path: /tmp/trader-contrast/
          retention-days: 1
          if-no-files-found: error
