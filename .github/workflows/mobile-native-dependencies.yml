name: Prepare native feature dependencies
on:
  push:
    branches: ['fix/android-native-workspaces-20261013']
    paths: ['.github/workflows/mobile-native-dependencies.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Install SDK-compatible public packages
        working-directory: apps/expo-go
        run: |
          pnpm install --frozen-lockfile
          pnpm exec expo install expo-file-system expo-sharing expo-print expo-image-picker expo-document-picker expo-notifications expo-device --pnpm
          pnpm add --save-exact fflate@0.8.2
          pnpm install --frozen-lockfile
      - name: Commit only the dependency manifest and lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/expo-go/package.json apps/expo-go/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m 'build(mobile): lock SDK-aligned native feature dependencies'
            git push origin HEAD:refs/heads/fix/android-native-workspaces-20261013
          fi
      - name: Capture source and installed mobile tools for local verification
        run: |
          mkdir -p /tmp/native-tools
          git rev-parse HEAD > /tmp/native-tools/COMMIT.txt
          git archive --format=tar.gz HEAD -o /tmp/native-tools/source.tar.gz
          tar -czf /tmp/native-tools/mobile-dependencies.tar.gz -C apps/expo-go node_modules
      - uses: actions/upload-artifact@v7
        with:
          name: native-feature-tools
          path: /tmp/native-tools/
          retention-days: 1
          if-no-files-found: error
