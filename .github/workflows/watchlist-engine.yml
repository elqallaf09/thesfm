name: Watchlist engine
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts-and-browser:
    name: Watchlist/contracts and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/engine/*.test.mjs
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: Actual embedded assets, staged prices, failure recovery and three languages
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_NO_COPY_PROMPT: '1'
        # Isolated contract fixtures do not use auth setup or any production secrets.
        # Real route authorization has separate tests; normal CI remains unchanged.
        run: pnpm exec playwright test tests/smoke/trader-watchlist-engine.spec.ts --project=chromium-desktop --project=mobile-chrome --project=mobile-webkit --no-deps --workers=2 --retries=0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: watchlist-engine-browser
          path: |
            playwright-report/
            test-results/
          retention-days: 7
