name: Recover verified Trader patch transport
on:
  push:
    branches: [fix/watchlist-owned-engine-20260915]
    paths: [.github/workflows/trader-evidence-transport-repair.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'elqallaf09/thesfm' && github.ref == 'refs/heads/fix/watchlist-owned-engine-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 3
      - name: Verify and apply the unchanged reviewed payload
        run: |
          python3 - <<'PY'
          import subprocess, textwrap
          from pathlib import Path
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == '413d410ef21a791af25f051a2abea325506d1d19'
          text = Path('.github/workflows/trader-evidence-repair-bootstrap.yml').read_text()
          code = textwrap.dedent(text.split("python3 - <<'PY'\n",1)[1].split('\n          PY',1)[0])
          for old, new in [('gcfTOJFJsyGQ2','gcfTOJFsyGQ2'), ('GuM+WJFJsyuw','GuM+WJFJ2yuw')]:
              assert code.count(old) == 1, old
              code = code.replace(old,new)
          assert code.count("git('rev-parse','HEAD^')") == 1
          code = code.replace("git('rev-parse','HEAD^')", "git('rev-parse','HEAD^^')")
          # The original gzip integrity and SHA256 checks are retained unchanged.
          exec(compile(code,'reviewed-trader-repair','exec'))
          Path('.github/workflows/trader-evidence-transport-repair.yml').unlink()
          PY
      - name: Test the actual repaired source
        run: |
          node --check src/trader-app/public/recommendation.js
          node --check src/trader-app/public/detail.js
          node --check src/trader-app/public/app.js
          node --check src/trader-app/public/watchlist-view.js
          node --test tests/engine/trader-signal-evidence.test.mjs
          git diff --check
      - name: Commit source and delete both temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/trader-app/public src/__tests__/unit/traderDensity.test.ts src/__tests__/unit/traderDetailVisualSystem.test.ts src/__tests__/unit/traderWorkspaceExperience.test.ts tests/engine/trader-signal-evidence.test.mjs tests/smoke/trader-watchlist-engine.spec.ts .github/workflows/trader-evidence-repair-bootstrap.yml .github/workflows/trader-evidence-transport-repair.yml
          git commit -m 'fix(trader): gate strong signals on source evidence and share watchlist drawer data'
          git push origin HEAD:fix/watchlist-owned-engine-20260915
