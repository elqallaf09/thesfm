name: Embedded mobile repair verification
on:
  push:
    branches: [fix/mobile-symbol-data-20260916]
    paths: [.github/workflows/mobile-repair-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply scoped reviewed repair
        run: |
          python .repair/apply.py
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/smoke/helpers/trader-drawer-fixture.ts')
          s = p.read_text().replace('language: string, theme: string)', "language: string, theme: string, watchlist = ['AAPL'])")
          s = s.replace('({ language, theme }) =>', '({ language, theme, watchlist }) =>')
          s = s.replace("JSON.stringify(['AAPL'])", 'JSON.stringify(watchlist)')
          s = s.replace('}, { language, theme });', '}, { language, theme, watchlist });')
          s = s.replace("locator('[data-symbol-details=\"AAPL\"]')", 'locator(`[data-symbol-details="${watchlist[0]}"]`)')
          p.write_text(s)
          PY
          node --check src/trader-app/public/app.js
          node --check src/trader-app/public/assets/drawer-data.js
          node --check src/trader-app/public/assets/drawer-focus.js
          git diff --check
          git rm -r .repair
          git rm .github/workflows/mobile-repair-verify.yml
          git add src tests
          git -c user.name='SFM repair' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(trader): load symbol tabs on demand and repair mobile drawer layout'
          git push origin HEAD:fix/mobile-symbol-data-20260916
      - run: npm install -g pnpm@11.1.3
      - run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck
      - name: Targeted unit regressions
        if: success() || failure()
        run: pnpm exec vitest run src/__tests__/unit/traderDrawerData.test.ts src/__tests__/unit/traderWorkspaceExperience.test.ts src/__tests__/unit/traderDensity.test.ts
      - name: Install browsers
        if: success() || failure()
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Browser regression journeys
        if: success() || failure()
        env:
          E2E_BASE_URL: http://127.0.0.1:9
        run: pnpm exec playwright test tests/smoke/trader-symbol-data.spec.ts tests/smoke/trader-drawer-focus.spec.ts tests/smoke/trader-drawer-host-focus.spec.ts --no-deps --project=chromium-desktop --project=mobile-chrome --project=mobile-webkit --retries=0
      - name: Archive exact source
        if: always()
        run: |
          mkdir -p .artifacts/source
          git rev-parse HEAD > .artifacts/source/head.txt
          git archive --format=tar.gz HEAD > .artifacts/source/sfm-tested.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-mobile-repair-verification
          path: |
            .artifacts/
            playwright-report/
            test-results/
          include-hidden-files: true
          retention-days: 3
