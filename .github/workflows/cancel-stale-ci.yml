name: Cancel stale CI runs

on:
  workflow_run:
    workflows: [CI]
    types: [requested]

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel older CI runs for the same PR branch
        uses: actions/github-script@v8
        with:
          script: |
            const current = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: current.workflow_id,
              branch: current.head_branch,
              event: 'pull_request',
              per_page: 100,
            });

            const cancellable = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);
            const currentCreatedAt = Date.parse(current.created_at);
            const staleRuns = data.workflow_runs.filter(run =>
              run.id !== current.id
              && cancellable.has(run.status)
              && Date.parse(run.created_at) <= currentCreatedAt
            );

            for (const run of staleRuns) {
              core.info(`Cancelling stale CI run ${run.id} (${run.head_sha}) for ${current.head_branch}`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              } catch (error) {
                if (error?.status === 409) {
                  core.info(`Run ${run.id} already finished or cannot be cancelled; continuing.`);
                  continue;
                }
                throw error;
              }
            }

            core.info(`Kept current CI run ${current.id}; cancelled ${staleRuns.length} older run(s).`);
