name: Prepare SFM TV iPhone lockfile
on:
  push:
    branches: ['feat/sfm-tv-iphone-testflight']
    paths: ['.github/workflows/prepare-tv-iphone-lock.yml']
permissions:
  contents: write
jobs:
  lock:
    if: github.ref == 'refs/heads/feat/sfm-tv-iphone-testflight'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/sfm-tv-iphone-testflight
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Import resolved dependencies with the repository package manager
        working-directory: apps/markets-tv-mobile
        run: |
          pnpm import
          pnpm install --frozen-lockfile
      - name: Save only the phone lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/markets-tv-mobile/pnpm-lock.yaml
          git rm apps/markets-tv-mobile/package-lock.json
          git commit -m 'build(tv-phone): lock Expo dependencies with pnpm'
          git push origin HEAD:refs/heads/feat/sfm-tv-iphone-testflight
      - run: pnpm typecheck && pnpm test && pnpm export:ios && pnpm exec expo prebuild --platform ios --no-install
        working-directory: apps/markets-tv-mobile
