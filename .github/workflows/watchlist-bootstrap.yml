name: Apply reviewed watchlist patch
on:
  push:
    branches: [fix/watchlist-owned-engine-20260915]
    paths: ['.github/watchlist-patch-*', '.github/workflows/watchlist-bootstrap.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'elqallaf09/thesfm' && github.ref == 'refs/heads/fix/watchlist-owned-engine-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Verify exact reviewed inputs and apply only the manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/watchlist-owned-engine-20260915'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip() == 'e20503c516b1ceb40770d640c9dab308820714b7'
          manifest = json.loads(pathlib.Path('.github/watchlist-patch-manifest.json').read_text())
          def blob(path):
              return subprocess.check_output(['git', 'hash-object', path], text=True).strip()
          for path, hashes in manifest.items():
              if hashes['before'] is None:
                  assert not pathlib.Path(path).exists(), path
              else:
                  assert blob(path) == hashes['before'], path
          encoded = ''.join(pathlib.Path(f'.github/watchlist-patch-{i:02}.b64').read_text() for i in range(1, 5))
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'e772812ecde57da7ba7b560e519ab2fb0bfdfbd3f8dee8c104c2baa07848cb38'
          patch = lzma.decompress(compressed)
          assert hashlib.sha256(patch).hexdigest() == '9d7f0193ef10c885ae016b15e461528d10af90b084faad1d2fa7548581d510f3'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          for path, hashes in manifest.items():
              assert blob(path) == hashes['after'], path
          subprocess.run(['git', 'add', '--', *manifest.keys()], check=True)
          staged = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(staged) == sorted(manifest), staged
          print('Verified all 14 reviewed source/test/documentation files; workflow files are not staged.')
          PY
          node --check src/trader-app/public/app.js
          node --check src/trader-app/public/watchlist-engine.js
          node --check src/trader-app/public/watchlist-view.js
      - name: Publish only to this feature branch
        shell: bash
        run: |
          git config user.name 'THE SFM Engineering'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(trader): load saved symbols through owned resilient watchlist engine'
          git push origin HEAD:refs/heads/fix/watchlist-owned-engine-20260915
          git rev-parse HEAD HEAD^{tree}
