name: Finalize SFM Private AI migration

on:
  push:
    branches: [fix/ai-workspace-providers-layout-20260916]
    paths:
      - .github/workflows/sfm-private-ai-final-migrate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate remaining project AI routes and configuration
        run: python3 scripts/migrate-project-ai-to-sfm-private.py
      - name: Prove live source no longer imports third-party model vendors
        shell: bash
        run: |
          set -euo pipefail
          pattern="OPENAI_API_KEY|ANTHROPIC_API_KEY|AI_GATEWAY_API_KEY|AI_GATEWAY_TOKEN|api\\.openai\\.com|api\\.anthropic\\.com|from ['\"]openai['\"]|@ai-sdk/anthropic|createAnthropic|OpenAI Vision|openai-vision"
          if grep -RniE "$pattern" src \
            --exclude-dir='__tests__' \
            --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='*.spec.ts' --exclude='*.spec.tsx'; then
            echo 'Third-party model-vendor dependency remains in live source.' >&2
            exit 1
          fi
      - name: Remove unused vendor SDK dependencies
        run: pnpm remove openai @ai-sdk/anthropic
      - name: Prove direct vendor packages are gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE '"openai"\s*:|"@ai-sdk/anthropic"\s*:' package.json
          ! grep -nE '^OPENAI_|^ANTHROPIC_|^AI_GATEWAY_' .env.example
          ! grep -RniE "openAi: 'OpenAI'|OpenAI Vision|Future local model|Futur modèle local|نموذج محلي مستقبلي" src/components/ai-analyst
      - name: Validate TypeScript, lint, translations and production build
        run: |
          pnpm typecheck
          pnpm lint
          pnpm check:i18n
          pnpm build
          git diff --check
      - name: Run focused private-AI and project regressions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t tests < <(find src/__tests__/unit -maxdepth 1 -type f \( \
            -iname '*project*.test.ts' -o -iname '*Project*.test.ts' \
            -o -iname '*pitch*.test.ts' -o -iname '*Pitch*.test.ts' \
            -o -iname '*daily*.test.ts' -o -iname '*Daily*.test.ts' \
            -o -iname '*receipt*.test.ts' -o -iname '*Receipt*.test.ts' \
            -o -name 'intelligenceChatProviderResilience.test.ts' \
            -o -name 'economicAdvisorProviderResilience.test.ts' \
            -o -name 'sfmPrivateVisionProvider.test.ts' \
          \) | sort -u)
          printf 'Running %s focused private-AI/project tests\n' "${#tests[@]}"
          if [ "${#tests[@]}" -gt 0 ]; then pnpm exec vitest run "${tests[@]}"; fi
      - name: Commit verified migration and remove temporary audit machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/migrate-project-ai-to-sfm-private.py
          rm -f .github/workflows/sfm-private-ai-dependency-audit.yml
          rm -f .github/workflows/sfm-private-ai-final-migrate.yml
          git add -A
          git config user.name 'Mohammed alqallaf'
          git config user.email 'elqallaf09@gmail.com'
          git commit -m 'refactor(ai): complete SFM Private AI vendor migration'
          git push origin HEAD:fix/ai-workspace-providers-layout-20260916
