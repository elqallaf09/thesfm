name: Shariah official list shape
on:
  push:
    branches: [fix/shariah-evidence-coverage-production-proof]
    paths: ['.github/workflows/shariah-official-list-shape.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir -p official-list
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, pathlib, time
          out=pathlib.Path('official-list'); log=[]
          base='https://api2.dfm.ae/web/widgets/v1/data'
          def call(name,args,post=False):
            try:
              data=urllib.parse.urlencode(args)
              url=base if post else base+'?'+data
              req=urllib.request.Request(url,data=data.encode() if post else None,headers={'User-Agent':'THE-SFM admin@the-sfm.com','Accept':'application/json','Content-Type':'application/x-www-form-urlencoded'})
              with urllib.request.urlopen(req,timeout=20) as r:
                body=r.read(2000001)
                if len(body)>2000000: raise ValueError('size_limit')
                parsed=json.loads(body); (out/name).write_text(json.dumps(parsed,indent=2))
                log.append({'file':name,'method':'POST' if post else 'GET','status':r.status})
                return parsed
            except Exception as e:log.append({'file':name,'error':str(e)[:200]})
            finally:time.sleep(.4)
          args={'Command':'shariahlisting','Language':'en'}
          listing=call('listing-get.json',args) or call('listing-post.json',args,True)
          if isinstance(listing,list) and listing:
            current=listing[0]
            for exchange in ['dfm','nasdaq']:
              if exchange not in current.get('exchanges',[]):continue
              details={'Command':'shariahlistingdetails','year':current['year'],'quarter':current['quarter'],'exchange':exchange,'Language':'en'}
              call(exchange+'-get.json',details) or call(exchange+'-post.json',details,True)
          (out/'manifest.json').write_text(json.dumps(log,indent=2));print(json.dumps(log))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shariah-official-list-shape
          path: official-list
          retention-days: 1
