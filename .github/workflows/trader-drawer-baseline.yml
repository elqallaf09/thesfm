name: Trader drawer baseline reproduction
on:
  push:
    branches: [fix/trader-accessibility-followup]
    paths: [.github/workflows/trader-drawer-baseline.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run strict reproduction against unchanged production source
        env:
          E2E_BASE_URL: https://trader-drawer.invalid
          PLAYWRIGHT_JSON_OUTPUT_NAME: .artifacts/drawer-baseline/report.json
        run: pnpm exec playwright test tests/smoke/trader-drawer-focus.spec.ts --project=chromium-desktop --no-deps --workers=2 --retries=0 --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trader-drawer-baseline
          path: |
            .artifacts/drawer-baseline/
            test-results/
          retention-days: 7
          if-no-files-found: error
