name: Property public geography diagnostic
on:
  push:
    branches: [feat/investments-intelligence-2-foundation]
    paths: ['.github/workflows/real-estate-location-diagnostic.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only public municipality and district labels
        run: |
          node --input-type=module <<'JS'
          const base = 'https://www.data.gov.qa/api/explore/v2.1/catalog/datasets/weekly-real-estates-sales-bulletin/records';
          async function read(query) {
            const url = new URL(base);
            for (const [key, value] of Object.entries(query)) url.searchParams.set(key, value);
            const response = await fetch(url, { signal: AbortSignal.timeout(8000), redirect: 'error', headers: { Accept: 'application/json' } });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const value = await response.text();
            if (value.length > 1000000) throw new Error('Oversized public metadata');
            return JSON.parse(value);
          }
          const normalize = value => String(value ?? '').normalize('NFKC').replace(/\s+/gu, ' ').trim().toLowerCase();
          const fields = 'municipality_name,sm_lbldy,district_name,sm_lmntq';
          const latest = (await read({ select: fields, order_by: 'registration_date desc', limit: '1' })).results[0];
          console.log(JSON.stringify({ latestPublicArea: latest }));
          for (let offset = 0; offset < 500; offset += 100) {
            const data = await read({ select: fields, group_by: fields, order_by: 'municipality_name,district_name', limit: '100', offset: String(offset) });
            console.log(JSON.stringify({ offset, total_count: data.total_count, rows: data.results.length,
              municipalityMatches: data.results.filter(item => normalize(item.municipality_name) === normalize(latest.municipality_name)) }));
            if (data.total_count <= offset + data.results.length || data.results.length === 0) break;
          }
          JS
