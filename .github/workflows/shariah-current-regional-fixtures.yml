name: Shariah current regional fixtures
on:
  push:
    branches: [fix/shariah-evidence-coverage-production-proof]
    paths: ['.github/workflows/shariah-current-regional-fixtures.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          mkdir -p regional
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, pathlib, time, re
          out=pathlib.Path('regional'); log=[]
          def get(name,url):
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'THE-SFM admin@the-sfm.com'})
              with urllib.request.urlopen(req,timeout=20) as r:
                b=r.read(15000001)
                if len(b)>15000000:raise ValueError('size_limit')
                (out/name).write_bytes(b);log.append({'file':name,'url':url,'status':r.status,'bytes':len(b)})
                return b
            except Exception as e:log.append({'file':name,'url':url,'error':str(e)[:160]})
            finally:time.sleep(.3)
          get('NBK-Q2-2026.pdf','https://www.nbk.com/dam/jcr:a9b5fda4-e785-4705-8938-9a2364b06360/nbk-fs-2q-2026-e.pdf')
          for name,url in [('BOUBYAN','https://www.bankboubyan.com/en/investor-relations'),('IFA','https://www.ifakuwait.com/investors-enquiries.html')]:
            b=get(name+'.html',url)
            if b:
              links=list(dict.fromkeys(urllib.parse.urljoin(url,x) for x in re.findall(r'href=[\"\x27]([^\"\x27]+)',b.decode('utf8','replace')) if re.search(r'(2026|2025|financial|annual|report)',x,re.I)))
              (out/(name+'-links.json')).write_text(json.dumps(links,indent=2))
              for i,u in enumerate([x for x in links if re.search(r'\.pdf(?:$|\?)',x,re.I) and re.search(r'(2025|2026)',x)][:3]):get(name+f'-{i}.pdf',u)
          (out/'manifest.json').write_text(json.dumps(log,indent=2));print(json.dumps(log))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shariah-current-regional-fixtures
          path: regional
          retention-days: 1
