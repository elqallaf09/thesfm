name: Supabase Production Drift (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-drift
  cancel-in-progress: false

jobs:
  migration-history:
    name: Compare repository and Production migration history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PRODUCTION_REF: ${{ vars.SUPABASE_PRODUCTION_REF }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Validate required read-only credentials by name
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${SUPABASE_ACCESS_TOKEN:-}" ]] && missing+=(SUPABASE_ACCESS_TOKEN)
          [[ ! "${SUPABASE_PRODUCTION_REF:-}" =~ ^[a-z0-9]{20}$ ]] && missing+=(SUPABASE_PRODUCTION_REF)
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing required Production drift input: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Validate the drift parser
        run: node scripts/check-supabase-migration-drift.mjs --self-test

      - name: Link CLI metadata to the protected Production project
        run: pnpm dlx supabase@2.111.0 link --project-ref "$SUPABASE_PRODUCTION_REF"

      - name: Compare migration history without applying changes
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx supabase@2.111.0 migration list --linked | tee migration-status.txt
          node scripts/check-supabase-migration-drift.mjs migration-status.txt

      - name: Record read-only evidence
        if: always()
        shell: bash
        run: |
          {
            echo '### Supabase Production migration drift'
            echo
            echo 'This workflow only ran `supabase migration list --linked` and the repository parser.'
            echo 'It did not run db push, migration up, reset, repair, or any SQL statement.'
          } >> "$GITHUB_STEP_SUMMARY"
