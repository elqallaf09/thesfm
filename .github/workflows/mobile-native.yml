name: Mobile native validation
on:
  pull_request:
    paths: ['apps/**', 'ios-native/**', 'src/lib/mobile/**', 'src/app/api/mobile/**', '.github/workflows/mobile-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        product: [finance, investor, business]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      # The action defaults to the retired SDK `tools` package. Request only
      # the still-published platform tools needed by Gradle.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile Play and Huawei variants
        run: gradle -p apps/sfm-${{ matrix.product }}/android --no-daemon :app:assemblePlayDebug :app:assembleHuaweiDebug :app:bundlePlayRelease :app:bundleHuaweiRelease
      - uses: actions/upload-artifact@v7
        with:
          name: native-android-${{ matrix.product }}
          path: |
            apps/sfm-${{ matrix.product }}/android/app/build/outputs/apk/
            apps/sfm-${{ matrix.product }}/android/app/build/outputs/bundle/
  ios:
    runs-on: macos-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scheme: [TheSFM, TheSFMInvestor, TheSFMBusiness]
    steps:
      - uses: actions/checkout@v7
      - name: Build native iOS simulator application
        run: xcodebuild -project ios-native/TheSFM.xcodeproj -scheme '${{ matrix.scheme }}' -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath '/tmp/sfm-${{ matrix.scheme }}' CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-${{ matrix.scheme }}
          path: /tmp/sfm-${{ matrix.scheme }}/Build/Products/Debug-iphonesimulator/*.app
  expo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        product: [finance, investor, business]
    defaults:
      run:
        working-directory: apps/expo-go
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: apps/expo-go/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - name: Export both native platforms
        env:
          SFM_PRODUCT: ${{ matrix.product }}
        run: pnpm exec expo export --platform android --platform ios --output-dir .expo-validation/ci
