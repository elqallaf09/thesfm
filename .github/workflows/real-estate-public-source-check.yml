name: Real estate public source verification
on:
  push:
    branches: [feat/investments-intelligence-2-foundation]
    paths:
      - '.github/scripts/real-estate-public-source-discovery.mjs'
      - '.github/workflows/real-estate-public-source-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
      - name: Read official public dataset metadata without application secrets
        run: node .github/scripts/real-estate-public-source-discovery.mjs
