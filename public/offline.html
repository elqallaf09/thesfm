<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THE SFM — غير متصل</title>
    <style>
      :root { color-scheme: light; }
      body { align-items: center; background: var(--background); color: var(--foreground); display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; text-align: center; }
      main { max-width: 420px; }
      img { height: 80px; margin-bottom: 20px; width: 80px; }
      h1 { font-size: 24px; margin: 0 0 12px; }
      p { color: var(--foreground-secondary); line-height: 1.7; margin: 0 0 24px; }
      button { background: var(--primary); border: 0; border-radius: var(--radius-control); color: var(--foreground-inverse); cursor: pointer; font: inherit; font-weight: 700; min-height: 48px; padding: 0 20px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="THE SFM" />
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>للحفاظ على خصوصية بياناتك، لا يعرض THE SFM بيانات الحساب المحفوظة عند انقطاع الاتصال. تحقّق من الشبكة ثم أعد المحاولة.</p>
      <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
